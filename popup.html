<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRA · 个人研究助手</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f6f7f9;color:#202124}h1{font-size:22px;margin:0 0 12px}.section{margin-bottom:10px}.label{font-size:13px;font-weight:700;margin-bottom:6px}.box,textarea{width:100%;background:#fff;border:1px solid #d8dce2;border-radius:8px;padding:10px;line-height:1.6;white-space:pre-wrap;word-break:break-word;font:inherit}.original{min-height:80px;max-height:150px;overflow:auto}.prompt-box{min-height:120px;max-height:190px;overflow:auto;font-size:12px;color:#555}.result-box{min-height:180px;max-height:330px;resize:vertical}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls label{font-size:13px;font-weight:700}.controls select{width:100%;margin-top:5px;padding:8px;border:1px solid #c9ced6;border-radius:7px;background:#fff;font:inherit}.settings{display:flex;gap:7px}.settings input{flex:1;min-width:0;padding:9px;border:1px solid #c9ced6;border-radius:7px;font-size:12px}.settings button{flex:0 0 82px}.buttons{display:flex;gap:8px;margin-top:7px}button{flex:1;padding:9px;border:0;border-radius:7px;cursor:pointer;font:inherit}button:hover{opacity:.86}#copyOpenButton{background:#1f2937;color:#fff}#copyPromptButton,#copyResultButton{background:#0f766e;color:#fff}#openGPTButton,#saveSettingsButton,#resetButton{background:#e7e9ed;color:#202124}.custom{width:100%;margin-top:7px;min-height:60px;resize:vertical}.status{margin-top:8px;color:#68707d;font-size:12px}.settings-note{margin-top:5px;color:#8a9099;font-size:11px}
.processor-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}.processor-row{display:flex;gap:6px;align-items:center;font-size:12px}.processor-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.processor-row button{flex:0 0 auto;padding:5px 8px;font-size:11px}.processor-editor{display:grid;gap:7px;margin-top:9px}.processor-editor input{padding:8px;border:1px solid #c9ced6;border-radius:7px;font:inherit;font-size:12px}.error{color:#b42318;font-size:12px}
</style>
</head>
<body>
<h1>PRA · 个人研究助手</h1>
<div class="section"><div class="label">原文 / 当前输入</div><div id="original" class="box original">正在读取……</div></div>
<div class="section controls">
<label>Research Task<select id="mode"></select></label>
<label>AI 处理器<select id="processorSelect"></select></label>
</div>
<div class="section"><div class="buttons"><button id="copyOpenButton">复制 Prompt 并打开 GPT</button><button id="copyPromptButton">复制 Prompt</button></div><div class="buttons"><button id="openGPTButton">打开 PRA</button></div></div>
<div id="status" class="status">已获取选中文字。</div>
<script src="research-tasks.js"></script><script src="popup.js"></script>
</body>
</html>
